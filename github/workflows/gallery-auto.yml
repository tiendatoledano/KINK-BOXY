name: Auto-generar JSON de galería

on:
  push:
    paths:
      - 'assets/img/galeria/**'

jobs:
  regenerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generar JSON por categoría
        run: |
          cd assets/img/galeria
          for cat in entrenamiento eventos examenes historico; do
            archivos=$(ls ${cat}-*.{jpg,jpeg,png,webp,gif,avif} 2>/dev/null | sort -V)
            if [ -z "$archivos" ]; then
              echo "[]" > ../../../data/galeria-${cat}.json
            else
              echo "[" > ../../../data/galeria-${cat}.json
              first=true
              for f in $archivos; do
                if [ "$first" = true ]; then
                  first=false
                else
                  echo "," >> ../../../data/galeria-${cat}.json
                fi
                printf '  "%s"' "$f" >> ../../../data/galeria-${cat}.json
              done
              echo "" >> ../../../data/galeria-${cat}.json
              echo "]" >> ../../../data/galeria-${cat}.json
            fi
          done

      - name: Commit si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/galeria-*.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto: actualizar JSON de galería"
          git push