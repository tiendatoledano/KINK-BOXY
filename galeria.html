<link rel="stylesheet" href="assets/css/layout.css">

<body>

<main id="main">

  <section class="page-header">
    <div class="page-header__kanji" aria-hidden="true">画</div>
    <div class="container page-header__inner">
      <nav class="breadcrumb" aria-label="Ruta">
        <a href="index.html">Inicio</a> <span>/</span> <span>Galería</span>
      </nav>
      <h1 class="reveal">Galería Visual</h1>
      <p class="reveal" data-delay="1">Registro Gráfico y Documental</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filters reveal" role="tablist" aria-label="Filtros de galería">
        <button class="is-active" data-filter="all">Todas</button>
        <button data-filter="entrenamiento">Entrenamiento</button>
        <button data-filter="eventos">Eventos</button>
        <button data-filter="examenes">Exámenes</button>
        <button data-filter="historico">Histórico</button>
      </div>

      <div class="gallery" id="gallery">
        <div class="gallery__item gallery__item--wide" data-cat="entrenamiento" tabindex="0" role="button" aria-label="Ver imagen 1">[ Imagen 01 ]</div>
        <div class="gallery__item" data-cat="eventos" tabindex="0" role="button" aria-label="Ver imagen 2">[ Imagen 02 ]</div>
        <div class="gallery__item gallery__item--tall" data-cat="examenes" tabindex="0" role="button" aria-label="Ver imagen 3">[ Imagen 03 ]</div>
        <div class="gallery__item" data-cat="historico" tabindex="0" role="button" aria-label="Ver imagen 4">[ Imagen 04 ]</div>
        <div class="gallery__item" data-cat="entrenamiento" tabindex="0" role="button" aria-label="Ver imagen 5">[ Imagen 05 ]</div>
        <div class="gallery__item" data-cat="eventos" tabindex="0" role="button" aria-label="Ver imagen 6">[ Imagen 06 ]</div>
        <div class="gallery__item" data-cat="examenes" tabindex="0" role="button" aria-label="Ver imagen 7">[ Imagen 07 ]</div>
        <div class="gallery__item gallery__item--wide" data-cat="historico" tabindex="0" role="button" aria-label="Ver imagen 8">[ Imagen 08 ]</div>
        <div class="gallery__item" data-cat="entrenamiento" tabindex="0" role="button" aria-label="Ver imagen 9">[ Imagen 09 ]</div>
        <div class="gallery__item" data-cat="eventos" tabindex="0" role="button" aria-label="Ver imagen 10">[ Imagen 10 ]</div>
      </div>
    </div>
  </section>

</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vista ampliada">
  <button class="lightbox__close" id="lightboxClose" aria-label="Cerrar">✕</button>
  <div class="lightbox__box" id="lightboxBox">[ Imagen Ampliada ]</div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

  /* Filtros */
  var filterBtns = document.querySelectorAll('.filters button');
  var items = document.querySelectorAll('.gallery__item');
  filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterBtns.forEach(function(b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      var f = btn.getAttribute('data-filter');
      items.forEach(function(it) {
        var show = (f === 'all' || it.getAttribute('data-cat') === f);
        it.classList.toggle('is-hidden', !show);
      });
    });
  });

  /* Lightbox */
  var lb = document.getElementById('lightbox');
  var lbBox = document.getElementById('lightboxBox');
  var lbClose = document.getElementById('lightboxClose');

  function openLb(item) {
    lbBox.textContent = item.textContent.trim() + ' · Vista ampliada';
    lb.classList.add('is-open');
    document.body.classList.add('no-scroll');
    lbClose.focus();
  }
  function closeLb() {
    lb.classList.remove('is-open');
    document.body.classList.remove('no-scroll');
  }

  items.forEach(function(it) {
    it.addEventListener('click', function() { openLb(it); });
    it.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLb(it);
      }
    });
  });
  lbClose.addEventListener('click', closeLb);
  lb.addEventListener('click', function(e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lb.classList.contains('is-open')) closeLb();
  });
});
</script>
</body>
</html>
